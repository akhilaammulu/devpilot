spring:
  application:
    name: devpilot-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./devpilot_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      printer:
        enabled: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder-client-secret}
            scope:
              - read:user
              - user:email
              - repo

server:
  port: 8080
