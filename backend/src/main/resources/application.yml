spring:
  application:
    name: devpilot-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./devpilot_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  graphql:
    graphiql:
      enabled: false
    schema:
      printer:
        enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${DEVPILOT_KAFKA_ENABLED:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder-client-secret}
            scope:
              - read:user
              - user:email
              - repo

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: ${DEVPILOT_REDIS_ENABLED:false}
  metrics:
    tags:
      application: devpilot-backend

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [corr=%X{correlationId:-system}] %logger{36} - %msg%n"

server:
  port: 8080
